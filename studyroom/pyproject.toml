[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studyroom"
version = "0.1.0"
description = "Σύστημα κρατήσεων αιθουσών μελέτης της βιβλιοθήκης (ECE_INF950)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "radon>=6",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["studyroom"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F"]
